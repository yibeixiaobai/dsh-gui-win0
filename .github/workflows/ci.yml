name: desktop-ci

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --no-frozen-lockfile
      - shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/prepare-runtime.ps1
      - shell: pwsh
        run: python scripts/smoke-runtime.py runtime/bin/deepseek-harness-sdk-runtime-win-x64.exe
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm tauri build
      - shell: pwsh
        run: |
          $file = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $file) { throw "NSIS installer was not produced." }
          if ($file.Length -lt 1000000) { throw "NSIS installer is unexpectedly small." }
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  status:
    if: always()
    needs: [frontend, windows-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          FINAL_STATE: ${{ (needs.frontend.result == 'success' && needs.windows-package.result == 'success') && 'success' || 'failure' }}
          DESCRIPTION: ${{ format('frontend={0}; windows-package={1}', needs.frontend.result, needs.windows-package.result) }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.FINAL_STATE,
              context: 'desktop-ci/final',
              description: process.env.DESCRIPTION
            })
