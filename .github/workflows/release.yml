name: release-windows

on:
  push:
    tags:
      - "dsh-desktop-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create or update the GitHub Release after a successful build"
        required: true
        default: false
        type: boolean

concurrency:
  group: dsh-desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read and validate version
        id: meta
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $version = [string]$package.version

          if ([string]$tauri.version -ne $version) {
            throw "Version mismatch: package.json=$version, tauri.conf.json=$($tauri.version)"
          }

          if ($cargo -notmatch '(?m)^version = "([^"]+)"') {
            throw "Could not read src-tauri/Cargo.toml version."
          }

          if ($Matches[1] -ne $version) {
            throw "Version mismatch: package.json=$version, Cargo.toml=$($Matches[1])"
          }

          if ($env:GITHUB_REF_NAME -like 'dsh-desktop-v*') {
            $tagVersion = $env:GITHUB_REF_NAME.Substring('dsh-desktop-v'.Length)
            if ($tagVersion -ne $version) {
              throw "Tag version $tagVersion does not match package version $version"
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Desktop dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build pinned Harness runtime
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/prepare-runtime.ps1

      - name: Smoke-test Harness runtime
        shell: pwsh
        run: python scripts/smoke-runtime.py runtime/bin/deepseek-harness-sdk-runtime-win-x64.exe

      - name: Typecheck
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri NSIS installer
        run: pnpm tauri build

      - name: Validate installer
        id: installer
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $file = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" |
            Sort-Object Length -Descending |
            Select-Object -First 1

          if (-not $file) {
            throw "NSIS installer was not produced."
          }

          if ($file.Length -lt 1000000) {
            throw "NSIS installer is unexpectedly small: $($file.Length) bytes"
          }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          $output = Join-Path $PWD "release/DSH-Desktop-$env:VERSION-windows-x64-setup.exe"
          Copy-Item $file.FullName $output

          $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($output))" |
            Set-Content "$output.sha256" -NoNewline

          "installer=$output" >> $env:GITHUB_OUTPUT
          "size=$($file.Length)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dsh-desktop-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/dsh-desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: dsh-desktop-windows-x64
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: dsh-desktop-v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DSH Desktop v${{ needs.build.outputs.version }}
          generate_release_notes: true
          prerelease: false
          files: |
            release/DSH-Desktop-${{ needs.build.outputs.version }}-windows-x64-setup.exe
            release/DSH-Desktop-${{ needs.build.outputs.version }}-windows-x64-setup.exe.sha256
