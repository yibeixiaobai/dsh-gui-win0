name: release-windows

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "runtime/dsh-runtime.json"
      - "scripts/prepare-runtime.ps1"
      - "src-tauri/**"
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --no-frozen-lockfile
      - shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/prepare-runtime.ps1
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm tauri build
      - id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - id: installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $file = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $file) { throw "NSIS installer not found." }
          $release = Join-Path $env:RUNNER_TEMP ("DSH-Desktop-{0}-windows-x64-setup.exe" -f $env:VERSION)
          Copy-Item $file.FullName $release
          $hash = (Get-FileHash $release -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$release.sha256" "$hash  $([System.IO.Path]::GetFileName($release))"
          "release=$release" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dsh-desktop-v${{ steps.version.outputs.version }}
          name: DSH Desktop v${{ steps.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ steps.installer.outputs.release }}
            ${{ steps.installer.outputs.release }}.sha256
